site_name: TumorQuantAI
site_description: Reproducible H&E whole-slide cell typing, overlays, coordinates, and cohort tables
site_author: TumorQuantAI developers
site_url: https://cfarkas.github.io/tumorquantai/

repo_name: cfarkas/tumorquantai
repo_url: https://github.com/cfarkas/tumorquantai
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/tumorquantai.css

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Use light theme

nav:
  - Home: index.md
  - Getting Started:
      - 1. Install Requirements: installation.md
      - 2. QuickStart Example 1 — One Public WSI: quick_start.md
      - 3. Apply to Your Own WSIs: own_data.md
      - Input Files and Physical Scale: inputs.md
      - HistoPLUS Model Access: how-to/model-access.md
  - Full Tutorial: full_tutorial.md
  - Other Example Runs:
      - Structural Software Demo: start-here/demo.md
      - Four Public WSIs at 10%: tutorials/four-public-slides.md
      - Breast IHC TIFF Patches at 100%: tutorials/breast-ihc-patches.md
  - Run and Configure:
      - Workflow, Presets, and Resume: running.md
      - Download Public MDS Files: how-to/download-mds.md
      - Convert MDS and Prepare TIFFs: how-to/prepare-tiff.md
      - Create a Sample Sheet: how-to/sample-sheet.md
      - Choose 1%, 10%, or 100%: how-to/choose-preset.md
      - Resume an Interrupted Run: how-to/resume.md
      - CLI Reference: reference/cli.md
      - Parameters: reference/parameters.md
      - Configuration and Environment: reference/configuration.md
      - Input Manifest Schema: reference/input-manifest.md
  - Understand Results:
      - Output Files: outputs.md
      - Results and Workflow Gallery: gallery.md
      - What TumorQuantAI Predicts: explanation/predictions.md
      - Sampling and Reproducibility: explanation/sampling.md
      - Counts versus Fractions: explanation/counts-fractions.md
      - Failed Sample versus Biological Zero: explanation/failed-vs-zero.md
      - Source versus Target MPP: explanation/mpp.md
      - Research Limitations: explanation/research-limitations.md
      - Provenance Fields: reference/provenance.md
  - Help and About:
      - Troubleshooting: troubleshooting/index.md
      - Citation and Research Use: citation_research_use.md
      - Developer Guide: developer_guide.md
      - Glossary: GLOSSARY.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
