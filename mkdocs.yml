site_name: TumorQuantAI
site_description: Documentation for reproducible cell-type quantification in H&E whole-slide images
site_author: TumorQuantAI developers
site_url: https://cfarkas.github.io/tumorquantai/

repo_name: cfarkas/tumorquantai
repo_url: https://github.com/cfarkas/tumorquantai
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/tumorquantai.css

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Use light theme

nav:
  - Home: index.md
  - Start here:
      - Structural demo: start-here/demo.md
      - Public one-slide quickstart: start-here/public-slide.md
      - Inspect and run your own slide: start-here/own-slides.md
  - Tutorials:
      - Review one public slide (1%): tutorials/one-public-slide.md
      - Run four public slides (10%): tutorials/four-public-slides.md
      - Full 21-slide collection: tutorials/full-collection.md
  - How-to guides:
      - Install and check the computer: how-to/install.md
      - Configure HistoPLUS access: how-to/model-access.md
      - Prepare TIFF inputs: how-to/prepare-tiff.md
      - Download and convert MDS: how-to/download-mds.md
      - Create a sample sheet: how-to/sample-sheet.md
      - Choose smoke, fast, or full: how-to/choose-preset.md
      - Resume an interrupted run: how-to/resume.md
      - Review QC overlays: how-to/review-overlays.md
      - Export to QuPath: how-to/qupath.md
      - Move work and output safely: how-to/storage.md
  - Explanation:
      - What TumorQuantAI predicts: explanation/predictions.md
      - WSI, pyramid levels, L0/L2: explanation/wsi-pyramid.md
      - Source versus target MPP: explanation/mpp.md
      - Sampling and reproducibility: explanation/sampling.md
      - Counts versus fractions: explanation/counts-fractions.md
      - Failed sample versus biological zero: explanation/failed-vs-zero.md
      - Research limitations: explanation/research-limitations.md
  - Reference:
      - CLI: reference/cli.md
      - Parameters: reference/parameters.md
      - Configuration and environment: reference/configuration.md
      - Input manifest schema: reference/input-manifest.md
      - Output files and schema: reference/outputs.md
      - Status/report JSON schema: reference/status-report-json.md
      - Exit codes: reference/exit-codes.md
      - Provenance fields: reference/provenance.md
      - Citation guide: reference/citations.md
      - Glossary: GLOSSARY.md
      - Advanced tools: TOOLS.md
  - Troubleshooting: troubleshooting/index.md
  - Advanced analysis:
      - Clinical stratification and ML: CLINICAL_ML.md
  - Maintainers:
      - Usability benchmark: maintainers/USABILITY_BENCHMARK.md
      - Release checklist: maintainers/RELEASE_CHECKLIST.md
      - Dataset/Zenodo consistency: maintainers/DATASET_CONSISTENCY.md
      - License decision status: maintainers/LICENSE_DECISION.md
      - Zenodo publishing mechanics: ZENODO_PUBLISHING.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
