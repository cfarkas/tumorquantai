<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">TumorQuantAI portable WSI input layout</title>
  <desc id="desc">A diagram showing a slides directory with one folder per sample, each containing an L0 primary TIFF and an L2 companion TIFF, plus an optional sample sheet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="62" y="66" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="760">Portable input layout</text>
  <text x="64" y="104" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="19">One sample folder, one highest-resolution L0 TIFF, and one L2 companion for sampled analyses.</text>

  <g transform="translate(70 145)" filter="url(#shadow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="655" height="260" rx="20" fill="#f8fafc"/>
    <text x="35" y="48" fill="#0f172a" font-size="22" font-weight="700">slides/</text>
    <text x="65" y="90" fill="#334155" font-size="20">├── case_001/</text>
    <text x="105" y="130" fill="#0f766e" font-size="19">│   ├── 1_L0_rgb.tif</text>
    <text x="105" y="166" fill="#0284c7" font-size="19">│   └── 1_L2_rgb.tif</text>
    <text x="65" y="207" fill="#334155" font-size="20">└── case_002/</text>
    <text x="105" y="243" fill="#64748b" font-size="18">    ├── 1_L0_rgb.tif</text>
    <text x="105" y="276" fill="#64748b" font-size="18">    └── 1_L2_rgb.tif</text>
  </g>

  <g transform="translate(780 145)" filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect width="350" height="260" rx="20" fill="#f8fafc"/>
    <text x="28" y="48" fill="#0f172a" font-size="22" font-weight="750">What each file means</text>
    <circle cx="38" cy="90" r="9" fill="#0f766e"/>
    <text x="60" y="97" fill="#334155" font-size="18">L0: primary image analyzed</text>
    <circle cx="38" cy="132" r="9" fill="#0284c7"/>
    <text x="60" y="139" fill="#334155" font-size="18">L2: lower-resolution companion</text>
    <circle cx="38" cy="174" r="9" fill="#f59e0b"/>
    <text x="60" y="181" fill="#334155" font-size="18">MPP: verified physical scale</text>
    <circle cx="38" cy="216" r="9" fill="#a855f7"/>
    <text x="60" y="223" fill="#334155" font-size="18">sample sheet: optional mapping</text>
  </g>
</svg>