<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">TumorQuantAI 21-slide lymphoma tutorial at ten percent</title>
  <desc id="desc">A workflow diagram showing 21 public Zenodo MDS slides, checksum validation, L0 and L2 conversion, roster inspection, deterministic ten-percent tissue sampling, HistoPLUS cell typing, per-slide quality control, and cohort tables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f4c5c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#5eead4"/>
    </marker>
    <pattern id="tiles" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" rx="4" fill="#e0f2fe"/>
      <path d="M4 16c5-11 10 8 17-7" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1440" height="500" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="39" font-weight="760">Full tutorial · 21 lymphoma WSIs at 10%</text>
  <text x="72" y="108" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="20">Every sample is downloaded, verified, converted, inspected, sampled with one recorded seed, and audited.</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(55 160)" filter="url(#shadow)">
      <rect width="190" height="215" rx="18" fill="#f8fafc"/>
      <g transform="translate(41 28)">
        <rect x="0" y="18" width="78" height="104" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
        <rect x="15" y="0" width="78" height="104" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
        <rect x="30" y="36" width="78" height="104" rx="8" fill="#fdf2f8" stroke="#c026d3" stroke-width="4"/>
        <path d="M42 93c18-38 31 20 51-14" fill="none" stroke="#db2777" stroke-width="7" stroke-linecap="round"/>
      </g>
      <text x="95" y="177" fill="#0f172a" font-size="20" font-weight="700">21 MDS slides</text>
      <text x="95" y="198" fill="#475569" font-size="13">Zenodo record 21466410</text>
    </g>
    <path d="M259 267H298" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(315 160)" filter="url(#shadow)">
      <rect width="190" height="215" rx="18" fill="#f8fafc"/>
      <circle cx="95" cy="81" r="43" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
      <path d="M71 82l17 17 33-39" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="167" fill="#0f172a" font-size="20" font-weight="700">verify</text>
      <text x="95" y="190" fill="#475569" font-size="13">21 SHA-256 checks</text>
    </g>
    <path d="M519 267H558" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(575 160)" filter="url(#shadow)">
      <rect width="190" height="215" rx="18" fill="#f8fafc"/>
      <rect x="35" y="32" width="120" height="91" rx="10" fill="#fdf2f8" stroke="#c026d3" stroke-width="4"/>
      <path d="M49 84c23-48 44 26 69-18 12-20 19 5 27-10" fill="none" stroke="#db2777" stroke-width="8" stroke-linecap="round"/>
      <rect x="57" y="104" width="76" height="29" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/>
      <text x="95" y="170" fill="#0f172a" font-size="20" font-weight="700">convert L0 + L2</text>
      <text x="95" y="192" fill="#475569" font-size="13">resumable TIFF export</text>
    </g>
    <path d="M779 267H818" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(835 160)" filter="url(#shadow)">
      <rect width="190" height="215" rx="18" fill="#f8fafc"/>
      <rect x="31" y="30" width="128" height="105" rx="10" fill="url(#tiles)"/>
      <rect x="49" y="48" width="62" height="62" rx="6" fill="none" stroke="#0f766e" stroke-width="6"/>
      <text x="95" y="169" fill="#0f172a" font-size="20" font-weight="700">sample 10%</text>
      <text x="95" y="191" fill="#475569" font-size="13">deterministic tissue tiles</text>
    </g>
    <path d="M1039 267H1078" stroke="#5eead4" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(1095 160)" filter="url(#shadow)">
      <rect width="190" height="215" rx="18" fill="#f8fafc"/>
      <g stroke="#fff" stroke-width="4">
        <circle cx="55" cy="60" r="17" fill="#0ea5e9"/>
        <circle cx="102" cy="48" r="14" fill="#f59e0b"/>
        <circle cx="143" cy="68" r="20" fill="#14b8a6"/>
        <circle cx="70" cy="110" r="21" fill="#a855f7"/>
        <circle cx="118" cy="105" r="16" fill="#f43f5e"/>
        <circle cx="151" cy="119" r="14" fill="#0ea5e9"/>
      </g>
      <text x="95" y="169" fill="#0f172a" font-size="20" font-weight="700">HistoPLUS</text>
      <text x="95" y="191" fill="#475569" font-size="13">typed-cell coordinates</text>
    </g>
  </g>

  <g transform="translate(210 412)">
    <rect width="1020" height="55" rx="27" fill="#0b2537" stroke="#5eead4" stroke-width="2"/>
    <text x="510" y="35" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18">21 overlays + 21 summaries + aggregation audit + count/fraction matrices · failures never become biological zeros</text>
  </g>
</svg>