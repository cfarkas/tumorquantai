<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
  <title id="title">TumorQuantAI public colon immunohistochemistry workflow</title>
  <desc id="desc">Five steps show public Zenodo download and checksum verification, catalog-validated MDS identity, serial-section registration to CK20, CD3 and CD8 compartment-density quantification, and pathologist review of provisional outputs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.58" stop-color="#164e63"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1440" height="470" rx="28" fill="url(#background)"/>
  <text x="65" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="39" font-weight="760">Colon IHC · public WSI to reviewable proxy</text>
  <text x="67" y="108" fill="#cffafe" font-family="system-ui, sans-serif" font-size="20">CD3 and CD8 serial sections are aligned to CK20, quantified by proxy compartment, and kept separate from consensus Immunoscore.</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(55 155)" filter="url(#shadow)">
      <rect width="210" height="205" rx="18" fill="#f8fafc"/>
      <path d="M105 30v55M81 65l24 24 24-24" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="105" cy="104" r="25" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
      <path d="M92 104l9 9 18-22" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="160" fill="#0f172a" font-size="19" font-weight="720">1 · download + verify</text>
      <text x="105" y="184" fill="#475569" font-size="13">57 public Zenodo files</text>
    </g>
    <path d="M278 258H301" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(315 155)" filter="url(#shadow)">
      <rect width="210" height="205" rx="18" fill="#f8fafc"/>
      <rect x="47" y="34" width="116" height="104" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="4"/>
      <path d="M66 59h78M66 80h78M66 101h52" stroke="#0e7490" stroke-width="7" stroke-linecap="round"/>
      <circle cx="139" cy="115" r="19" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
      <path d="M130 115l6 6 12-15" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="105" y="160" fill="#0f172a" font-size="19" font-weight="720">2 · validate catalog</text>
      <text x="105" y="184" fill="#475569" font-size="13">30 MDS · aliases · SHA-256</text>
    </g>
    <path d="M538 258H561" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(575 155)" filter="url(#shadow)">
      <rect width="210" height="205" rx="18" fill="#f8fafc"/>
      <rect x="43" y="37" width="91" height="78" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
      <rect x="75" y="59" width="91" height="78" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="4" opacity="0.84"/>
      <path d="M54 91c24-36 43 20 70-18M87 113c24-36 43 20 68-18" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
      <text x="105" y="160" fill="#0f172a" font-size="19" font-weight="720">3 · register sections</text>
      <text x="105" y="184" fill="#475569" font-size="13">CD3/CD8 → CK20</text>
    </g>
    <path d="M798 258H821" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(835 155)" filter="url(#shadow)">
      <rect width="210" height="205" rx="18" fill="#f8fafc"/>
      <path d="M47 42h116v92H47Z" fill="#fff7ed" stroke="#c2410c" stroke-width="4"/>
      <path d="M49 43c30 14 39 48 64 49 23 1 29-22 48-27v67H49Z" fill="#bbf7d0" opacity="0.9"/>
      <g fill="#7c3aed" stroke="#fff" stroke-width="2">
        <circle cx="73" cy="76" r="8"/><circle cx="97" cy="110" r="8"/><circle cx="126" cy="72" r="8"/><circle cx="146" cy="106" r="8"/>
      </g>
      <text x="105" y="160" fill="#0f172a" font-size="19" font-weight="720">4 · quantify density</text>
      <text x="105" y="184" fill="#475569" font-size="13">epithelium/stroma proxies</text>
    </g>
    <path d="M1058 258H1081" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(1095 155)" filter="url(#shadow)">
      <rect width="290" height="205" rx="18" fill="#f8fafc"/>
      <circle cx="78" cy="82" r="42" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
      <text x="78" y="94" fill="#92400e" font-size="37" font-family="Georgia, serif" font-weight="700">pI</text>
      <path d="M139 48h105M139 72h76M139 96h94M139 120h61" stroke="#155e75" stroke-width="7" stroke-linecap="round"/>
      <text x="145" y="160" fill="#0f172a" font-size="19" font-weight="720">5 · pathologist review</text>
      <text x="145" y="184" fill="#475569" font-size="13">accept · flag · exclude</text>
    </g>
  </g>

  <g transform="translate(155 397)">
    <rect width="1130" height="48" rx="24" fill="#082f49" stroke="#67e8f9" stroke-width="2"/>
    <text x="565" y="31" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17">Research proxy only · consensus Immunoscore stays blank without reviewed CT/IM regions and the validated external reference</text>
  </g>
</svg>
