name: Documentation
description: Report unclear, incorrect, inaccessible, or missing documentation
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach raw WSI, model weights, tokens, PHI, patient-level data,
        private manifests, or sensitive logs. Use neutral example paths.
  - type: input
    id: page
    attributes:
      label: Page or section URL
    validations:
      required: true
  - type: textarea
    id: audience_goal
    attributes:
      label: What were you trying to do?
      description: Include your experience level and the outcome you expected.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no credentials, model weights, WSI, PHI, patient data, or private paths.
          required: true
