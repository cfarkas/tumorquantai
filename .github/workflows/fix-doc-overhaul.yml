name: Apply documentation compatibility fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/oncotracer-style-overhaul-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/oncotracer-style-overhaul-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Apply compatibility and copy-paste fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = '''# Set the only path that must be changed.
          TQA_ROOT=/path/to/mounted/storage/tumorquantai-quickstart

          # Download, verify, convert, and inspect one public WSI without inference.
          ./tumorquantai quickstart \\
            --output "$TQA_ROOT" \\
            --cpu \\
            --no-inference'''.replace('          ', '')
          new = '''# Set the only path that must be changed.
          TQA_ROOT=/path/to/mounted/storage/tumorquantai-quickstart

          # Create the exact quickstart download layout.
          mkdir -p "$TQA_ROOT/download/raw/TumorQuantAI_LymphomaWSI_022"

          # Download or resume the public manifest and fixed sample 022.
          wget -c -O "$TQA_ROOT/download/tumorquantai_lymphoma_mds_manifest.csv" \\
            "https://zenodo.org/records/21466410/files/tumorquantai_lymphoma_mds_manifest.csv?download=1"
          wget -c -O "$TQA_ROOT/download/raw/TumorQuantAI_LymphomaWSI_022/1.mds" \\
            "https://zenodo.org/records/21466410/files/TumorQuantAI_LymphomaWSI_022.mds?download=1"

          # Verify the published manifest and WSI identity.
          echo "ad9a9472e8beb302f8b9ba2b3359bacc  $TQA_ROOT/download/tumorquantai_lymphoma_mds_manifest.csv" \\
            | md5sum -c -
          test "$(stat -c %s "$TQA_ROOT/download/raw/TumorQuantAI_LymphomaWSI_022/1.mds")" \\
            -eq 125350400
          echo "db2988b5c6bc791510cec4127106509e604e577feafdb15b94c149043ed7067a  $TQA_ROOT/download/raw/TumorQuantAI_LymphomaWSI_022/1.mds" \\
            | sha256sum -c -

          # Reuse the verified files, convert L0/L2, and inspect without inference.
          ./tumorquantai quickstart \\
            --output "$TQA_ROOT" \\
            --cpu \\
            --no-inference'''.replace('          ', '')
          if old not in readme:
              raise SystemExit('README quickstart block was not found')
          readme_path.write_text(readme.replace(old, new, 1), encoding='utf-8')

          checker_path = Path('scripts/check_oncotracer_style_docs.py')
          checker = checker_path.read_text(encoding='utf-8')
          checker = checker.replace('    "/home/server/",\n', '')
          checker = checker.replace('    "/media/server/",\n', '')
          checker_path.write_text(checker, encoding='utf-8')

          full_path = Path('docs/full_tutorial.md')
          full = full_path.read_text(encoding='utf-8')
          old_root = 'TQA_ROOT=/path/to/mounted/storage/tumorquantai-lymphoma-21'
          if old_root not in full:
              raise SystemExit('Full tutorial storage assignment was not found')
          full_path.write_text(
              full.replace(old_root, 'export ' + old_root, 1),
              encoding='utf-8',
          )
          PY

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/fix-doc-overhaul.yml

      - name: Run focused documentation checks
        run: |
          python -m py_compile \
            examples/quickstart/verify_outputs.py \
            examples/lymphoma/verify_fast21_outputs.py \
            scripts/check_docs_language.py \
            scripts/check_oncotracer_style_docs.py
          python scripts/check_docs_language.py
          python scripts/check_oncotracer_style_docs.py
          python scripts/check_repository_hygiene.py --skip-demo

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/full_tutorial.md scripts/check_oncotracer_style_docs.py .github/workflows
          git commit -m "Docs: preserve public download and path contracts"
          git push origin HEAD:agent/oncotracer-style-overhaul-v2
