name: External resource checks

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Check public release, dataset, DOI, docs, and model metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_external_resources.py

      - name: Probe direct Zenodo WSI URLs without downloading slides
        run: python scripts/check_zenodo_wsi_urls.py
