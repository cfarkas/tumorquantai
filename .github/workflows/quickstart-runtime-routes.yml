name: QuickStart #1 — Docker, Singularity, Poetry, and Conda

on:
  pull_request:
    paths:
      - tumorquantai
      - tumorquantai_cli/**
      - run.sh
      - main.nf
      - nextflow.config
      - nextflow_schema.json
      - environment-ci.yml
      - environment.yml
      - pyproject.toml
      - poetry.lock
      - requirements-tutorial.txt
      - bin/**
      - tests/fixtures/stub_worker.py
      - examples/quickstart/**
      - .github/workflows/quickstart-runtime-routes.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tumorquantai-four-routes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TQA_ROOT: /mnt/tumorquantai-data/quickstart
  ROUTES_ROOT: /mnt/tumorquantai-data/runtime-routes
  SAMPLE: TumorQuantAI_LymphomaWSI_022
  DOCKER_IMAGE: tumorquantai-ci-runtime:latest
  SIF_PATH: /mnt/tumorquantai-data/tumorquantai-ci-runtime.sif
  STUB_WEIGHT: /mnt/tumorquantai-data/tumorquantai-ci-stub-weight.pt

jobs:
  validate-four-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h

      - name: Create a mounted large-data path
        run: |
          sudo mkdir -p /mnt/tumorquantai-source /mnt/tumorquantai-data
          sudo mount --bind /mnt/tumorquantai-source /mnt/tumorquantai-data
          sudo chown -R "$(id -u):$(id -g)" /mnt/tumorquantai-source /mnt/tumorquantai-data
          mkdir -p "$ROUTES_ROOT"
          findmnt -T /mnt/tumorquantai-data
          df -hT /mnt/tumorquantai-data

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tutorial.txt

      - name: Install public-data preparation dependencies
        run: python -m pip install --requirement requirements-tutorial.txt

      - name: Install pinned Nextflow
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL \
            https://github.com/nextflow-io/nextflow/releases/download/v25.10.2/nextflow \
            -o "$RUNNER_TEMP/bin/nextflow"
          echo "60aff30ad532030657296ca1fa72e37befda236bfd4fc7358a3cabf5e7589dd7  $RUNNER_TEMP/bin/nextflow" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/nextflow"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download, verify, convert, and inspect public sample 022
        run: |
          ./tumorquantai quickstart \
            --output "$TQA_ROOT" \
            --cpu \
            --no-inference

          python examples/quickstart/verify_outputs.py \
            --tutorial-root "$TQA_ROOT" \
            --preparation-only

      - name: Build the deterministic runtime-test Docker image
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.tumorquantai-ci" <<'DOCKER'
          FROM python:3.11-bookworm
          RUN python -m pip install --no-cache-dir 'pandas>=2.2,<3'
          DOCKER
          docker build \
            --tag "$DOCKER_IMAGE" \
            --file "$RUNNER_TEMP/Dockerfile.tumorquantai-ci" \
            "$RUNNER_TEMP"
          docker run --rm "$DOCKER_IMAGE" \
            python -c 'import pandas; print(pandas.__version__)'

      - name: Install Apptainer and build the matching SIF image
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer version
          apptainer build "$SIF_PATH" "docker-daemon:$DOCKER_IMAGE"
          test -s "$SIF_PATH"
          apptainer exec "$SIF_PATH" \
            python -c 'import pandas; print(pandas.__version__)'

      - name: Install pinned Miniforge
        run: |
          curl -fsSL \
            https://github.com/conda-forge/miniforge/releases/download/26.3.2-2/Miniforge3-26.3.2-2-Linux-x86_64.sh \
            -o "$RUNNER_TEMP/Miniforge3.sh"
          echo "42260ffe3830fb953d5eee1bbb32229ff06aa7c3833c1ed7a9a0420a95685d94  $RUNNER_TEMP/Miniforge3.sh" \
            | sha256sum --check
          bash "$RUNNER_TEMP/Miniforge3.sh" \
            -b \
            -p "$RUNNER_TEMP/miniforge"
          echo "$RUNNER_TEMP/miniforge/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/miniforge/bin/conda" --version

      - name: Create the non-biological local test weight
        run: |
          printf 'TumorQuantAI deterministic CI stub weight\n' > "$STUB_WEIGHT"
          test -s "$STUB_WEIGHT"

      - name: Install and run the Docker route
        run: |
          PREFIX="$RUNNER_TEMP/install-docker"
          OUTPUT="$ROUTES_ROOT/docker-results"
          WORK="$ROUTES_ROOT/docker-work"
          CACHE="$ROUTES_ROOT/docker-cache"

          ./tumorquantai install \
            --docker \
            --prefix "$PREFIX" \
            --no-nextflow-download

          "$PREFIX/bin/tumorquantai" run "$TQA_ROOT/converted" \
            --sample-sheet "$TQA_ROOT/converted/samples.csv" \
            --output "$OUTPUT" \
            --work-dir "$WORK" \
            --cache-dir "$CACHE" \
            --preset smoke \
            --sample "$SAMPLE" \
            --source-mpp 0.261780 \
            --local-weight "$STUB_WEIGHT" \
            --container-image "$DOCKER_IMAGE" \
            --docker \
            --cpu \
            --cpus 2 \
            --memory '4 GB' \
            --num-workers 0 \
            --celltypes-batch-size 1 \
            --no-convert-to-pyramidal \
            --fail-fast \
            -- \
            --worker_script "$PWD/tests/fixtures/stub_worker.py"

          python - "$OUTPUT" docker "$SAMPLE" <<'PY'
          import csv, json, sys
          from pathlib import Path
          root, backend, sample = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          required = [
              root / 'START_HERE.html',
              root / sample / 'summary/summary.json',
              root / sample / 'cell_types/class_counts.csv',
              root / 'aggregated_celltypes/sample_aggregation_audit.csv',
              root / 'aggregated_celltypes/celltype_counts_by_sample.csv',
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size, path
          manifest = json.loads((root / 'workflow_metadata/tumorquantai_run.json').read_text())
          assert manifest['completion_status'] == 'complete', manifest
          assert manifest['execution_backend'] == backend, manifest
          assert float(manifest['sampling_percent']) == 1.0, manifest
          with required[3].open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          row = next(item for item in rows if item.get('sample_id') == sample)
          assert str(row.get('included', '')).lower() in {'true', '1', 'yes'}, row
          print(f'PASS: {backend} route completed for {sample}')
          PY

      - name: Install and run the Singularity or Apptainer route
        run: |
          PREFIX="$RUNNER_TEMP/install-singularity"
          OUTPUT="$ROUTES_ROOT/singularity-results"
          WORK="$ROUTES_ROOT/singularity-work"
          CACHE="$ROUTES_ROOT/singularity-cache"

          ./tumorquantai install \
            --singularity \
            --prefix "$PREFIX" \
            --no-nextflow-download

          "$PREFIX/bin/tumorquantai" run "$TQA_ROOT/converted" \
            --sample-sheet "$TQA_ROOT/converted/samples.csv" \
            --output "$OUTPUT" \
            --work-dir "$WORK" \
            --cache-dir "$CACHE" \
            --preset smoke \
            --sample "$SAMPLE" \
            --source-mpp 0.261780 \
            --local-weight "$STUB_WEIGHT" \
            --container-image "$SIF_PATH" \
            --singularity \
            --cpu \
            --cpus 2 \
            --memory '4 GB' \
            --num-workers 0 \
            --celltypes-batch-size 1 \
            --no-convert-to-pyramidal \
            --fail-fast \
            -- \
            --worker_script "$PWD/tests/fixtures/stub_worker.py"

          python - "$OUTPUT" singularity "$SAMPLE" <<'PY'
          import csv, json, sys
          from pathlib import Path
          root, backend, sample = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          required = [
              root / 'START_HERE.html',
              root / sample / 'summary/summary.json',
              root / sample / 'cell_types/class_counts.csv',
              root / 'aggregated_celltypes/sample_aggregation_audit.csv',
              root / 'aggregated_celltypes/celltype_counts_by_sample.csv',
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size, path
          manifest = json.loads((root / 'workflow_metadata/tumorquantai_run.json').read_text())
          assert manifest['completion_status'] == 'complete', manifest
          assert manifest['execution_backend'] == backend, manifest
          assert float(manifest['sampling_percent']) == 1.0, manifest
          with required[3].open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          row = next(item for item in rows if item.get('sample_id') == sample)
          assert str(row.get('included', '')).lower() in {'true', '1', 'yes'}, row
          print(f'PASS: {backend} route completed for {sample}')
          PY

      - name: Install and run the Poetry route
        run: |
          PREFIX="$RUNNER_TEMP/install-poetry"
          OUTPUT="$ROUTES_ROOT/poetry-results"
          WORK="$ROUTES_ROOT/poetry-work"
          CACHE="$ROUTES_ROOT/poetry-cache"

          ./tumorquantai install \
            --poetry \
            --prefix "$PREFIX" \
            --no-nextflow-download

          "$PREFIX/bin/tumorquantai" run "$TQA_ROOT/converted" \
            --sample-sheet "$TQA_ROOT/converted/samples.csv" \
            --output "$OUTPUT" \
            --work-dir "$WORK" \
            --cache-dir "$CACHE" \
            --preset smoke \
            --sample "$SAMPLE" \
            --source-mpp 0.261780 \
            --local-weight "$STUB_WEIGHT" \
            --container-image "$DOCKER_IMAGE" \
            --docker \
            --cpu \
            --cpus 2 \
            --memory '4 GB' \
            --num-workers 0 \
            --celltypes-batch-size 1 \
            --no-convert-to-pyramidal \
            --fail-fast \
            -- \
            --worker_script "$PWD/tests/fixtures/stub_worker.py"

          python - "$OUTPUT" docker "$SAMPLE" <<'PY'
          import csv, json, sys
          from pathlib import Path
          root, backend, sample = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          required = [
              root / 'START_HERE.html',
              root / sample / 'summary/summary.json',
              root / sample / 'cell_types/class_counts.csv',
              root / 'aggregated_celltypes/sample_aggregation_audit.csv',
              root / 'aggregated_celltypes/celltype_counts_by_sample.csv',
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size, path
          manifest = json.loads((root / 'workflow_metadata/tumorquantai_run.json').read_text())
          assert manifest['completion_status'] == 'complete', manifest
          assert manifest['execution_backend'] == backend, manifest
          assert float(manifest['sampling_percent']) == 1.0, manifest
          with required[3].open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          row = next(item for item in rows if item.get('sample_id') == sample)
          assert str(row.get('included', '')).lower() in {'true', '1', 'yes'}, row
          print(f'PASS: Poetry launcher with {backend} completed for {sample}')
          PY

      - name: Install and run the Conda route
        env:
          NXF_CONDA_CACHEDIR: /mnt/tumorquantai-data/runtime-routes/conda-environments
        run: |
          PREFIX="$RUNNER_TEMP/install-conda"
          OUTPUT="$ROUTES_ROOT/conda-results"
          WORK="$ROUTES_ROOT/conda-work"
          CACHE="$ROUTES_ROOT/conda-cache"

          ./tumorquantai install \
            --conda \
            --prefix "$PREFIX" \
            --no-nextflow-download

          "$PREFIX/bin/tumorquantai" run "$TQA_ROOT/converted" \
            --sample-sheet "$TQA_ROOT/converted/samples.csv" \
            --output "$OUTPUT" \
            --work-dir "$WORK" \
            --cache-dir "$CACHE" \
            --preset smoke \
            --sample "$SAMPLE" \
            --source-mpp 0.261780 \
            --local-weight "$STUB_WEIGHT" \
            --conda \
            --cpu \
            --cpus 2 \
            --memory '4 GB' \
            --num-workers 0 \
            --celltypes-batch-size 1 \
            --no-convert-to-pyramidal \
            --fail-fast \
            -- \
            --worker_script "$PWD/tests/fixtures/stub_worker.py" \
            --conda_environment "$PWD/environment-ci.yml"

          python - "$OUTPUT" conda "$SAMPLE" <<'PY'
          import csv, json, sys
          from pathlib import Path
          root, backend, sample = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          required = [
              root / 'START_HERE.html',
              root / sample / 'summary/summary.json',
              root / sample / 'cell_types/class_counts.csv',
              root / 'aggregated_celltypes/sample_aggregation_audit.csv',
              root / 'aggregated_celltypes/celltype_counts_by_sample.csv',
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size, path
          manifest = json.loads((root / 'workflow_metadata/tumorquantai_run.json').read_text())
          assert manifest['completion_status'] == 'complete', manifest
          assert manifest['execution_backend'] == backend, manifest
          assert float(manifest['sampling_percent']) == 1.0, manifest
          with required[3].open(newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          row = next(item for item in rows if item.get('sample_id') == sample)
          assert str(row.get('included', '')).lower() in {'true', '1', 'yes'}, row
          print(f'PASS: {backend} route completed for {sample}')
          PY

      - name: Upload route reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tumorquantai-one-wsi-four-route-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.TQA_ROOT }}/START_HERE.html
            ${{ env.TQA_ROOT }}/inspection/INSPECTION.html
            ${{ env.ROUTES_ROOT }}/*-results/START_HERE.html
            ${{ env.ROUTES_ROOT }}/*-results/workflow_metadata/tumorquantai_run.json
            ${{ env.ROUTES_ROOT }}/*-results/aggregated_celltypes/sample_aggregation_audit.csv

      - name: Unmount the CI data path
        if: always()
        run: sudo umount /mnt/tumorquantai-data || true
