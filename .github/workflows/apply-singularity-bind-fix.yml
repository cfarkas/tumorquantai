name: Apply explicit Singularity portability fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply_singularity_bind_fix.py
      - .github/workflows/apply-singularity-bind-fix.yml

permissions:
  contents: write

concurrency:
  group: tumorquantai-singularity-bind-fix
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.head_ref == 'agent/oncotracer-style-v1-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out overhaul branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oncotracer-style-v1-overhaul
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Apply explicit Apptainer and Singularity run options
        run: |
          python scripts/apply_singularity_bind_fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_runtime_backends.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    gpu_options = ', text.index(
              'def test_singularity_route_binds_every_required_host_path'
          ))
          end = text.index('\n\n\ndef test_empty_exclude', start)
          replacement = (
              "    assert config.count(\n"
              "        'runOptions = \\\"--nv ${params.singularity_run_options'\n"
              "    ) == 2"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          chmod +x run.sh tumorquantai

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-tutorial.txt
          python -m pip install 'pytest>=8,<9'

      - name: Validate the runtime patch
        run: |
          bash -n run.sh
          python -m py_compile \
            scripts/apply_singularity_bind_fix.py \
            tests/test_runtime_backends.py
          python -m pytest -q \
            tests/test_runtime_backends.py \
            tests/test_install_command.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          yaml.safe_load(
              Path('.github/workflows/quickstart-runtime-routes.yml').read_text(
                  encoding='utf-8'
              )
          )
          launcher = Path('run.sh').read_text(encoding='utf-8')
          config = Path('nextflow.config').read_text(encoding='utf-8')
          assert 'SINGULARITY_RUN_OPTIONS="--bind ${COMBINED_BINDPATH}"' in launcher
          assert 'NF_ARGS+=("--singularity_run_options=${SINGULARITY_RUN_OPTIONS}")' in launcher
          assert 'export APPTAINER_BINDPATH=' not in launcher
          assert 'export SINGULARITY_BINDPATH=' not in launcher
          assert config.count('runOptions = params.singularity_run_options') == 2
          assert config.count(
              'runOptions = "--nv ${params.singularity_run_options'
          ) == 2
          PY
          git diff --check

      - name: Commit and push the validated source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add run.sh nextflow.config tests/test_runtime_backends.py
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "Pass explicit binds to Apptainer runtime"
          git push origin HEAD:agent/oncotracer-style-v1-overhaul
