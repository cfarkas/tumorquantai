name: Documentation examples

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - examples/**
      - mkdocs.yml
      - requirements-docs.txt
      - requirements-tutorial.txt
      - scripts/check_docs_language.py
      - scripts/check_oncotracer_style_docs.py
      - .github/workflows/docs-style.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - examples/**
      - mkdocs.yml
      - requirements-docs.txt
      - requirements-tutorial.txt
      - scripts/check_docs_language.py
      - scripts/check_oncotracer_style_docs.py
      - .github/workflows/docs-style.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Compile tutorial verifiers
        run: |
          python -m py_compile \
            examples/quickstart/verify_outputs.py \
            examples/lymphoma/verify_fast21_outputs.py \
            scripts/check_docs_language.py \
            scripts/check_oncotracer_style_docs.py

      - name: Check language, paths, and command boxes
        run: |
          python scripts/check_docs_language.py
          python scripts/check_oncotracer_style_docs.py

      - name: Build GitHub Pages strictly
        run: python -m mkdocs build --strict --site-dir site
