name: Apply simplified tutorials on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.head_ref == 'agent/simplify-tutorials-and-histoplus-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-tutorials-and-histoplus-access
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute the versioned tutorial patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-simplified-tutorials.yml').read_text(encoding='utf-8')
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if start not in workflow or end not in workflow:
              raise SystemExit('Unable to locate the embedded tutorial patch')
          embedded = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile("if True:\n" + embedded, 'apply-simplified-tutorials.py', 'exec'), {})
          PY

      - name: Remove temporary patch workflows
        run: |
          rm -f .github/workflows/apply-simplified-tutorials.yml
          rm -f .github/workflows/apply-simplified-tutorials-on-pr.yml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tutorial.txt
          python -m pip install 'pytest>=8,<9' 'jsonschema>=4,<5' 'PyYAML>=6,<7'
          python -m pip install -r docs/requirements.txt

      - name: Validate command, tutorials, and documentation
        run: |
          chmod +x tumorquantai
          python -m py_compile tumorquantai scripts/*.py tests/test_install_command.py
          python -m pytest -q tests/test_install_command.py tests/test_runtime_backends.py
          ./tumorquantai convert --help
          ./tumorquantai install --docker --dry-run
          python scripts/check_docs_language.py
          python scripts/check_oncotracer_style_docs.py
          python scripts/check_repository_hygiene.py
          mkdocs build --strict
          ! grep -R -F 'TQA_ROOT' README.md docs examples
          ! grep -R -F 'REPO_ROOT' README.md docs examples
          ! grep -R -F 'python3 -m venv' README.md docs examples
          ! grep -R -F 'requirements-tutorial.txt' README.md docs examples
          git diff --check

      - name: Commit and push the validated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples tumorquantai tests scripts .github/workflows
          git commit -m "Simplify tutorials and document HistoPLUS access"
          git push origin HEAD:agent/simplify-tutorials-and-histoplus-access
