name: QuickStart Example 1 — one public WSI

on:
  pull_request:
    paths:
      - tumorquantai
      - bin/download_zenodo_mds.py
      - bin/download_zenodo_dataset.py
      - bin/mds_manifest.py
      - bin/mds_to_tiff.py
      - bin/tumorquantai_core.py
      - requirements-tutorial.txt
      - examples/quickstart/**
      - examples/lymphoma/tumorquantai_lymphoma_mds_manifest.csv
      - docs/quick_start.md
      - .github/workflows/quickstart-one-wsi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tumorquantai-one-wsi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TQA_ROOT: /mnt/tumorquantai-data/quickstart

jobs:
  prepare-public-wsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Create a non-root mounted data path
        run: |
          sudo mkdir -p /mnt/tumorquantai-source /mnt/tumorquantai-data
          sudo mount --bind /mnt/tumorquantai-source /mnt/tumorquantai-data
          sudo chown -R "$(id -u):$(id -g)" /mnt/tumorquantai-source /mnt/tumorquantai-data
          findmnt -T /mnt/tumorquantai-data
          df -hT /mnt/tumorquantai-data

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tutorial.txt

      - name: Install tutorial dependencies
        run: python -m pip install --requirement requirements-tutorial.txt

      - name: Download, verify, convert, and inspect sample 022
        run: |
          ./tumorquantai quickstart \
            --output "$TQA_ROOT" \
            --cpu \
            --no-inference

          python examples/quickstart/verify_outputs.py \
            --tutorial-root "$TQA_ROOT" \
            --preparation-only

      - name: Upload preparation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tumorquantai-one-wsi-preparation
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.TQA_ROOT }}/START_HERE.html
            ${{ env.TQA_ROOT }}/tumorquantai_report.json
            ${{ env.TQA_ROOT }}/inspection/INSPECTION.html
            ${{ env.TQA_ROOT }}/inspection/inspection_manifest.csv

      - name: Unmount the CI data path
        if: always()
        run: sudo umount /mnt/tumorquantai-data || true
