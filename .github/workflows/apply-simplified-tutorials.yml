          root = Path.cwd()

          def read(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (root / path).write_text(text.rstrip() + "\n", encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Unable to patch {label}")
              return text.replace(old, new, 1)

          cli = read("tumorquantai")
          cli = replace_once(
              cli,
              '''            "Run, inspect, and understand TumorQuantAI without assembling a long "
            "Nextflow command. Research use only; not clinically validated."
''',
              '''            "Run, inspect, convert, and understand TumorQuantAI without "
            "assembling a long Nextflow command."
''',
              "CLI description",
          )
          cli = replace_once(
              cli,
              '''            "  tumorquantai inspect /data/slides --output /data/tqa-inspection\n"
            "  tumorquantai quickstart --no-inference"
''',
              '''            "  tumorquantai inspect /data/slides --output /data/tqa-inspection\n"
            "  tumorquantai convert downloads --output slides --resume\n"
            "  tumorquantai quickstart --no-inference"
