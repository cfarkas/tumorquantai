    branches:
      - agent/simplify-tutorials-and-histoplus-access
    paths:
      - .github/workflows/apply-simplified-tutorials.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
