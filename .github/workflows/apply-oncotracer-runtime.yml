name: Apply OncoTracer-style runtime portability

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.head_ref == 'agent/oncotracer-style-v1-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/oncotracer-style-v1-overhaul
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply runtime transformation
        run: |
          python scripts/apply_oncotracer_runtime.py
          chmod +x tumorquantai run.sh

      - name: Install lightweight validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest>=8,<9' 'PyYAML>=6,<7' 'numpy>=1.26,<3' \
            'pandas>=2.2,<3' 'matplotlib>=3.8,<4' 'tifffile>=2024.12' \
            'Pillow>=10,<13' 'scipy>=1.15,<2' 'scikit-learn>=1.6,<2' \
            'openpyxl>=3.1,<4' 'requests>=2.32,<3' 'olefile>=0.47,<1' \
            'imagecodecs>=2024.12,<2027' 'jsonschema>=4,<5' 'poetry>=2,<3'

      - name: Create the Poetry lock file
        run: poetry lock

      - name: Install pinned Nextflow
        env:
          NXF_VER: '25.10.2'
        run: |
          curl -fsSL https://github.com/nextflow-io/nextflow/releases/download/v25.10.2/nextflow -o nextflow
          echo '60aff30ad532030657296ca1fa72e37befda236bfd4fc7358a3cabf5e7589dd7  nextflow' | sha256sum --check
          chmod +x nextflow
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Validate source and runtime profiles
        run: |
          bash -n run.sh
          python -m py_compile tumorquantai tumorquantai_cli/*.py scripts/*.py
          poetry check --lock
          python -m pytest -q tests/test_runtime_backends.py tests/test_tumorquantai_cli.py tests/test_tumorquantai_parameters.py
          for profile in local docker_cpu docker_gpu singularity_cpu singularity_gpu apptainer_cpu apptainer_gpu conda_cpu; do
            nextflow config -profile "$profile" -flat >/dev/null
          done
          nextflow run . \
            -profile local \
            --input_dir "$PWD/tests/fixtures" \
            --output_dir "$RUNNER_TEMP/runtime-discovery" \
            --dry_run true \
            -ansi-log false
          test -s "$RUNNER_TEMP/runtime-discovery/workflow_metadata/slides.tsv"

      - name: Remove temporary migration files
        run: |
          rm -f scripts/apply_oncotracer_runtime.py
          rm -f .github/workflows/apply-oncotracer-runtime.yml

      - name: Commit and push runtime portability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Docker, Singularity, Poetry, and Conda runtimes"
          git push origin HEAD:agent/oncotracer-style-v1-overhaul
