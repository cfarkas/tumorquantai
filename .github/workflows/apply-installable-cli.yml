name: Installable CLI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tumorquantai-installable-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-install-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tutorial.txt
          python -m pip install 'pytest>=8,<9'

      - name: Validate all installer choices
        run: |
          python -m pytest -q tests/test_install_command.py tests/test_runtime_backends.py
          ./tumorquantai install --docker --dry-run
          ./tumorquantai install --singularity --dry-run
          ./tumorquantai install --poetry --dry-run
          ./tumorquantai install --conda --dry-run

      - name: Perform a real user-level Docker installation
        run: |
          ./tumorquantai install --docker \
            --prefix "$RUNNER_TEMP/tumorquantai-install"
          export PATH="$RUNNER_TEMP/tumorquantai-install/bin:$PATH"
          tumorquantai --version
          tumorquantai quickstart --dry-run
